<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sync Match</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f8dbe3;
font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;
overflow:hidden;
}

.container{
width:90%;
max-width:360px;
text-align:center;
}

/* 앱 아이콘 */

.app-icon{
width:78px;
height:78px;
object-fit:cover;
border-radius:22px;
box-shadow:0 10px 22px rgba(210,90,110,.22);
}

/* 앱 이름 */

.brand{
margin-top:8px;
font-size:28px;
font-weight:800;
color:#222;
}

/* 프로필 */

.profiles{
margin-top:28px;
display:flex;
justify-content:center;
align-items:center;
gap:14px;
}

.profile{
width:92px;
height:92px;
border-radius:50%;
background:linear-gradient(
145deg,
#fff5f7,
#ffb0c0
);
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
border:4px solid rgba(255,255,255,.85);
box-shadow:0 8px 18px rgba(220,120,140,.16);
}

.heart{
font-size:36px;
color:#ff6d90;
animation:beat 1.1s infinite;
}

/* 텍스트 */

.match{
margin-top:24px;
font-size:34px;
font-weight:800;
letter-spacing:-1px;
color:#222;
}

.sub{
margin-top:10px;
font-size:15px;
color:#666;
line-height:1.5;
}

/* 버튼 */

.button{
margin-top:26px;
width:100%;
height:52px;
border-radius:999px;
background:linear-gradient(
90deg,
#ff6f91,
#ff8cab
);
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:16px;
font-weight:700;
box-shadow:0 10px 22px rgba(255,113,145,.28);
}

@keyframes beat{
0%,100%{
transform:scale(1);
}
50%{
transform:scale(1.15);
}
}

</style>
</head>

<body>

<div class="container">

<img src="sync.png" class="app-icon">

<div class="brand">Sync</div>

<div class="profiles">

<div class="profile">👨</div>

<div class="heart">❤</div>

<div class="profile">👩</div>

</div>

<div class="match">
매칭되었습니다
</div>

<div class="sub">
새로운 인연이 연결되었습니다.
</div>

<div class="button">
채팅 시작하기
</div>

</div>

</body>
</html>
