<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sync 매칭</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      background: #f8dbe3;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #222;
      overflow: hidden;
    }

    .box {
      width: 86%;
      max-width: 360px;
      text-align: center;
    }

    .app-icon {
      width: 82px;
      height: 82px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 12px 26px rgba(210, 90, 110, 0.22);
      margin-bottom: 16px;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 36px;
    }

    .profiles {
      position: relative;
      height: 132px;
      margin-bottom: 32px;
    }

    .profile {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      background: linear-gradient(145deg, #fff5f7, #ff9db2);
      border: 5px solid rgba(255,255,255,0.85);
      box-shadow: 0 12px 26px rgba(220, 120, 140, 0.18);
      position: absolute;
      top: 5px;
      overflow: hidden;
    }

    .profile.left { left: 36px; }
    .profile.right { right: 36px; }

    .face {
      font-size: 54px;
      line-height: 108px;
    }

    .heart {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff668d, #ff8aa5);
      color: white;
      position: absolute;
      left: 50%;
      top: 36px;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 29px;
      box-shadow: 0 10px 22px rgba(255, 113, 145, 0.35);
      animation: beat 1.15s infinite;
      z-index: 3;
    }

    .label {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.5);
      color: #f16d8b;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.8px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 850;
      letter-spacing: -1.2px;
    }

    .sub {
      margin-top: 14px;
      font-size: 15px;
      line-height: 1.6;
      color: #555;
    }

    .card {
      margin: 34px auto 0;
      width: 92%;
      padding: 17px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.48);
      box-shadow: 0 8px 20px rgba(220, 120, 140, 0.12);
      font-size: 14px;
      color: #444;
    }

    .button {
      margin: 24px auto 0;
      width: 92%;
      height: 50px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff668d, #ff8aa5);
      color: white;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 22px rgba(255, 113, 145, 0.28);
    }

    @keyframes beat {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.12); }
    }

    @media (max-height: 700px) {
      .app-icon { width: 70px; height: 70px; }
      .brand { margin-bottom: 24px; }
      .profiles { transform: scale(0.9); margin-bottom: 20px; }
      h1 { font-size: 30px; }
      .card { margin-top: 24px; }
      .button { margin-top: 18px; }
    }
  </style>
</head>

<body>
  <div class="box">
    <img class="app-icon" src="sync.png" alt="Sync">
    <div class="brand">Sync</div>

    <div class="profiles">
      <div class="profile left">
        <div class="face">👤</div>
      </div>
      <div class="profile right">
        <div class="face">👤</div>
      </div>
      <div class="heart">♥</div>
    </div>

    <div class="label">IT'S A MATCH</div>

    <h1>매칭되었습니다</h1>

    <div class="sub">
      서로가 서로를 선택했어요.<br>
      지금 바로 대화를 시작해보세요.
    </div>

    <div class="card">
      매칭 성공률 98% · 새로운 인연이 도착했습니다
    </div>

    <div class="button">
      채팅 시작하기
    </div>
  </div>
</body>
</html>
